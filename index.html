<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎨 Estudio de Arte</title>
<style>
:root{--hdr:44px;--bot:68px;--sb:64px;--pu:#6C3FC8;--pk:#E040FB;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;background:#777;font-family:'Segoe UI',sans-serif;}

/* HEADER */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);background:linear-gradient(135deg,var(--pu),var(--pk));display:flex;align-items:center;justify-content:space-between;padding:0 5px;z-index:300;box-shadow:0 2px 8px #0004;}
#hdr h1{color:#fff;font-size:.74rem;font-weight:700;}
#hdr-btns{display:flex;gap:3px;}
.hbtn{background:rgba(255,255,255,.22);border:none;border-radius:7px;color:#fff;font-size:.58rem;font-weight:700;padding:3px 7px;cursor:pointer;white-space:nowrap;}
.hbtn:active{background:rgba(255,255,255,.45);}
.hbtn.red{background:rgba(255,50,50,.45);}

/* APP LAYOUT */
#app{position:fixed;top:var(--hdr);left:0;right:0;bottom:var(--bot);display:flex;}

/* SIDEBAR */
#sidebar{width:var(--sb);background:#fff;border-right:1px solid #DDD8F8;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px;padding:3px 2px;scrollbar-width:thin;scrollbar-color:#C0B0EE transparent;flex-shrink:0;z-index:100;}
#sidebar::-webkit-scrollbar{width:3px;}
#sidebar::-webkit-scrollbar-thumb{background:#C0B0EE;border-radius:2px;}
#sb-search{padding:2px 2px 1px;flex-shrink:0;}
#sb-search input{width:100%;font-size:.56rem;padding:3px 4px;border:1.5px solid #DDD8F8;border-radius:6px;outline:none;}
.sb-sect{font-size:.42rem;color:#bbb;text-transform:uppercase;letter-spacing:.5px;padding:3px 2px 1px;font-weight:700;}
.icon-key{width:100%;aspect-ratio:1;background:#FAFAFE;border:1.5px solid #DDD8F8;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;flex-shrink:0;transition:transform .1s,border-color .12s;}
.icon-key:active{transform:scale(.85);}
.icon-key.sel{border-color:var(--pu);background:#EDE8FF;}
.icon-key svg{stroke:#111;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.icon-key span{font-size:.38rem;color:#888;text-align:center;line-height:1;}

/* CANVAS AREA */
#canvas-area{flex:1;position:relative;overflow:hidden;background:#777;display:flex;align-items:center;justify-content:center;}
#sheet-wrap{position:relative;background:#fff;box-shadow:0 4px 28px #0006;}

/* CAPAS — orden z correcto */
/* z1=marco  z2=pintura  z3=stickers */
#frame-canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;}
#paint-canvas{position:absolute;top:0;left:0;z-index:2;touch-action:none;cursor:crosshair;}
#sticker-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none;}

/* STICKERS */
.sticker{position:absolute;pointer-events:all;touch-action:none;user-select:none;}
.sticker svg,.sticker img{display:block;width:100%;height:100%;}
.sh-del{position:absolute;top:-8px;left:-8px;width:20px;height:20px;background:#FF3B30;border-radius:50%;border:2px solid #fff;color:#fff;font-size:.6rem;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 1px 4px #0006;}
.sh-fill{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;cursor:pointer;z-index:20;box-shadow:0 1px 4px #0006;}
.sh-resize{position:absolute;bottom:-8px;right:-8px;width:20px;height:20px;background:var(--pu);border-radius:50%;border:2px solid #fff;color:#fff;font-size:.65rem;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:se-resize;z-index:20;box-shadow:0 1px 4px #0006;}

/* BOTTOM BAR */
#bottom{position:fixed;bottom:0;left:0;right:0;height:var(--bot);background:#fff;border-top:1.5px solid #DDD8F8;display:flex;align-items:center;padding:0 5px;gap:4px;z-index:300;box-shadow:0 -2px 8px #0001;}
.tbtn{width:36px;height:36px;flex-shrink:0;border-radius:10px;border:1.5px solid #DDD8F8;background:#F8F5FF;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;transition:background .1s,transform .1s;}
.tbtn:active{transform:scale(.85);}
.tbtn.on{background:var(--pu);border-color:var(--pu);}
#sz-wrap{display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0;}
#sz-lbl{font-size:.38rem;color:#aaa;text-transform:uppercase;}
#sz{-webkit-appearance:none;width:46px;height:4px;border-radius:2px;background:linear-gradient(to right,var(--pu),var(--pk));outline:none;}
#sz::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--pu);border:2.5px solid white;box-shadow:0 1px 4px #0003;}
#pal-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
#pal-top{display:flex;align-items:center;gap:3px;}
#bprev{border-radius:4px;border:1px solid #eee;flex-shrink:0;}
#palette{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none;align-items:center;}
#palette::-webkit-scrollbar{display:none;}
.dot{width:30px;height:30px;flex-shrink:0;border-radius:50%;border:3px solid white;cursor:pointer;box-shadow:0 1px 4px #0002;transition:transform .1s;}
.dot:active{transform:scale(.85);}
.dot.sel{border-color:#333;box-shadow:0 0 0 2px #3336;transform:scale(1.15);}

/* MODALES */
.modal-bg{display:none;position:fixed;inset:0;background:#0008;z-index:500;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal-box{background:#fff;border-radius:18px;padding:16px;width:90%;max-width:320px;box-shadow:0 8px 32px #0005;}
.modal-box h2{font-size:.88rem;color:#333;margin-bottom:12px;text-align:center;}
.mrow{display:flex;gap:6px;align-items:center;margin-bottom:10px;}
.mrow label{font-size:.72rem;color:#666;white-space:nowrap;}
.mslider{-webkit-appearance:none;flex:1;height:4px;border-radius:2px;background:linear-gradient(to right,var(--pu),var(--pk));outline:none;}
.mslider::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--pu);border:2.5px solid white;}
.mval{font-size:.68rem;color:#888;min-width:24px;}
.mdots{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:12px;}
.fmd{aspect-ratio:1;border-radius:50%;border:2.5px solid white;cursor:pointer;box-shadow:0 1px 4px #0002;transition:transform .1s;}
.fmd.sel{border-color:#333;transform:scale(1.2);}
#fm-prev{width:100%;height:54px;border-radius:8px;margin-bottom:12px;position:relative;overflow:hidden;}
#fm-prev-in{position:absolute;background:#fff;}
.mbtns{display:flex;gap:8px;}
.mbtn{flex:1;padding:10px;border:none;border-radius:11px;font-size:.8rem;font-weight:700;cursor:pointer;}
.mbtn:active{opacity:.75;}
.mbtn.cancel{background:#F0ECFF;color:var(--pu);}
.mbtn.ok{background:linear-gradient(135deg,var(--pu),var(--pk));color:white;}
.mbtn.green{background:#30C759;color:white;}

/* Modal guardar */
#save-modal .modal-box{max-width:300px;}
.size-opt{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.size-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:2px solid #DDD8F8;border-radius:10px;cursor:pointer;transition:border-color .12s;}
.size-row.sel{border-color:var(--pu);background:#F0ECFF;}
.size-row input{accent-color:var(--pu);flex-shrink:0;}
.size-row div{flex:1;}
.size-row .size-name{font-size:.78rem;font-weight:700;color:#333;}
.size-row .size-desc{font-size:.6rem;color:#888;}

/* Modal letras */
#lt-bg{display:none;position:fixed;inset:0;background:#0008;z-index:500;align-items:flex-end;justify-content:center;}
#lt-bg.open{display:flex;}
#lt-box{background:#fff;border-radius:18px 18px 0 0;padding:12px 10px 18px;width:100%;max-width:480px;box-shadow:0 -4px 24px #0004;}
#lt-box h2{font-size:.84rem;color:#333;margin-bottom:8px;text-align:center;}
#lt-prev{min-height:30px;background:#F0ECFF;border-radius:8px;padding:5px 10px;font-size:1rem;font-weight:900;letter-spacing:2px;color:#333;margin-bottom:7px;text-align:center;word-break:break-all;}
#lt-kbd{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-bottom:7px;}
.lkey{padding:5px 1px;border:1.5px solid #DDD8F8;border-radius:7px;background:#F8F5FF;font-size:.75rem;font-weight:700;cursor:pointer;text-align:center;color:#333;}
.lkey:active{background:var(--pu);color:white;}
#lt-opts{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.lt-dir{padding:4px 7px;border:1.5px solid #DDD8F8;border-radius:7px;background:#F8F5FF;font-size:.6rem;font-weight:700;cursor:pointer;color:#555;}
.lt-dir.on{background:var(--pu);color:white;border-color:var(--pu);}
#lt-size{-webkit-appearance:none;width:70px;height:4px;border-radius:2px;background:linear-gradient(to right,var(--pu),var(--pk));outline:none;}
#lt-size::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--pu);border:2px solid white;}
.lt-btns{display:flex;gap:6px;}

/* TOAST */
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(50px);background:#222;color:#fff;padding:7px 18px;border-radius:14px;font-size:.78rem;z-index:999;pointer-events:none;transition:transform .25s;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);}
#file-input{display:none;}
</style>
</head>
<body>

<header id="hdr">
  <h1>🎨 Estudio de Arte</h1>
  <div id="hdr-btns">
    <button class="hbtn red" id="btn-sin-ico">🗂️ Sin íconos</button>
    <button class="hbtn red" id="btn-todo">🗑️ Todo</button>
    <button class="hbtn" id="btn-marco">🖼️ Marco</button>
    <button class="hbtn" id="btn-guardar">💾 Guardar</button>
  </div>
</header>

<div id="app">
  <div id="sidebar">
    <div id="sb-search"><input type="text" id="sb-input" placeholder="🔍 buscar..."></div>
  </div>
  <div id="canvas-area">
    <div id="sheet-wrap">
      <!-- z1: marco (detrás, no bloquea eventos) -->
      <canvas id="frame-canvas"></canvas>
      <!-- z2: pintura -->
      <canvas id="paint-canvas"></canvas>
      <!-- z3: stickers (adelante) -->
      <div id="sticker-layer"></div>
    </div>
  </div>
</div>

<div id="bottom">
  <div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;">
    <button class="tbtn on" id="btn-pincel">🖌️</button>
    <button class="tbtn" id="btn-borra">🩹</button>
  </div>
  <div id="sz-wrap">
    <span id="sz-lbl">Grosor</span>
    <input type="range" id="sz" min="2" max="36" value="10">
  </div>
  <button class="tbtn" id="btn-letra" title="Letras">🔤</button>
  <button class="tbtn" id="btn-foto" title="Foto">📷</button>
  <input type="file" id="file-input" accept="image/*">
  <div id="pal-wrap">
    <div id="pal-top">
      <canvas id="bprev" width="36" height="18"></canvas>
      <div id="palette"></div>
    </div>
  </div>
</div>

<!-- MODAL MARCO -->
<div class="modal-bg" id="fm-bg">
  <div class="modal-box">
    <h2>🖼️ Marco decorativo</h2>
    <div class="mdots" id="fm-dots"></div>
    <div class="mrow">
      <label>Grosor</label>
      <input type="range" class="mslider" id="fw" min="6" max="80" value="26">
      <span class="mval" id="fw-v">26</span>
    </div>
    <div id="fm-prev"><div id="fm-prev-in"></div></div>
    <div class="mbtns">
      <button class="mbtn cancel" id="fm-cancel">Cancelar</button>
      <button class="mbtn ok" id="fm-ok">✨ Aplicar</button>
    </div>
  </div>
</div>

<!-- MODAL GUARDAR -->
<div class="modal-bg" id="save-modal">
  <div class="modal-box">
    <h2>💾 Guardar imagen</h2>
    <div class="size-opt" id="size-opts">
      <label class="size-row sel">
        <input type="radio" name="psize" value="screen" checked>
        <div><div class="size-name">📱 Pantalla</div><div class="size-desc">Tamaño actual de la hoja</div></div>
      </label>
      <label class="size-row">
        <input type="radio" name="psize" value="a4l">
        <div><div class="size-name">🖨️ A4 Horizontal</div><div class="size-desc">3508 × 2480 px · 300 dpi</div></div>
      </label>
      <label class="size-row">
        <input type="radio" name="psize" value="a4p">
        <div><div class="size-name">📄 A4 Vertical</div><div class="size-desc">2480 × 3508 px · 300 dpi</div></div>
      </label>
      <label class="size-row">
        <input type="radio" name="psize" value="letter">
        <div><div class="size-name">📃 Carta</div><div class="size-desc">3300 × 2550 px · 300 dpi</div></div>
      </label>
      <label class="size-row">
        <input type="radio" name="psize" value="4x6">
        <div><div class="size-name">🖼️ Foto 4×6"</div><div class="size-desc">1800 × 1200 px · 300 dpi</div></div>
      </label>
    </div>
    <div class="mbtns">
      <button class="mbtn cancel" id="save-cancel">Cancelar</button>
      <button class="mbtn ok" id="save-ok">⬇️ Descargar</button>
    </div>
  </div>
</div>

<!-- MODAL LETRAS -->
<div id="lt-bg">
  <div id="lt-box">
    <h2>🔤 Agregar texto</h2>
    <div id="lt-prev">_</div>
    <div id="lt-kbd"></div>
    <div id="lt-opts">
      <button class="lt-dir on" id="lt-h">→ Horiz.</button>
      <button class="lt-dir" id="lt-v">↓ Vert.</button>
      <button class="lt-dir" id="lt-d">↗ Diag.</button>
      <span style="font-size:.58rem;color:#999;">Tam:</span>
      <input type="range" id="lt-size" min="14" max="120" value="48">
    </div>
    <div class="lt-btns">
      <button class="mbtn cancel" id="lt-cancel">Cancelar</button>
      <button class="mbtn green" id="lt-fill">🔁 Rellenar</button>
      <button class="mbtn ok" id="lt-ok">✅ Colocar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

// ═══ LAYOUT ═══
function layout(){
  const R=document.getElementById('canvas-area').getBoundingClientRect();
  SW=Math.floor(R.width); SH=Math.floor(R.height);
  const wrap=document.getElementById('sheet-wrap');
  wrap.style.width=SW+'px'; wrap.style.height=SH+'px';
  // Ambos canvas mismas dimensiones
  ['paint-canvas','frame-canvas'].forEach(id=>{
    const c=document.getElementById(id);
    c.style.width=SW+'px'; c.style.height=SH+'px';
    if(!window._init){ c.width=SW; c.height=SH; }
  });
  if(!window._init){
    const ctx=document.getElementById('paint-canvas').getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,SW,SH);
    window._init=true;
  }
}

function buildSidebar(){

// ═══ CREAR SVG DOM para sticker ═══
function makeSVGDom(ic){
  let vb,paths;
  if(ic.lu){ vb='0 0 24 24'; paths=LU[ic.lu]||[]; }
  else { vb='0 0 32 32'; paths=ic.p||[]; }
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',vb);
  svg.style.cssText='display:block;width:100%;height:100%;cursor:crosshair;';
  svg.setAttribute('fill','none'); svg.setAttribute('stroke','#111');
  svg.setAttribute('stroke-width',ic.lu?'1.5':'1.8');
  svg.setAttribute('stroke-linecap','round'); svg.setAttribute('stroke-linejoin','round');
  paths.forEach(d=>{
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d); p.setAttribute('fill','none');
    p.setAttribute('stroke','#111');
    p.setAttribute('stroke-width',ic.lu?'1.5':'1.8');
    p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
    p.classList.add('sp'); svg.appendChild(p);
  });
  return svg;
}

// ═══ COLOCAR STICKER ═══
function placeSticker(x,y){
  if(!selIcon) return;
  const layer=document.getElementById('sticker-layer');
  const sz=120;
  const wrap=document.createElement('div');
  wrap.className='sticker';
  wrap.style.cssText=`left:${Math.max(0,Math.min(SW-sz,x-sz/2))}px;top:${Math.max(0,Math.min(SH-sz,y-sz/2))}px;width:${sz}px;height:${sz}px;position:absolute;pointer-events:all;touch-action:none;user-select:none;`;
  const svg=makeSVGDom(selIcon);
  wrap.appendChild(svg);
  // Pintar zona al tocar
  const paint=e=>{ const p=e.target.closest('.sp'); if(!p) return; e.stopPropagation(); p.setAttribute('fill',eraser?'none':color); };
  svg.addEventListener('click',paint);
  svg.addEventListener('touchend',e=>{ e.preventDefault(); paint(e); },{passive:false});
  // Handles
  addHandles(wrap,layer,true);
  layer.appendChild(wrap);
  makeDraggable(wrap,layer);
}

function addHandles(wrap,layer,isSVG){
  // ✕ borrar
  const del=document.createElement('div'); del.className='sh-del'; del.textContent='✕';
  del.addEventListener('click',e=>{ e.stopPropagation(); layer.removeChild(wrap); });
  del.addEventListener('touchend',e=>{ e.preventDefault(); e.stopPropagation(); layer.removeChild(wrap); },{passive:false});
  // 🎨 colorear todo (solo SVG)
  if(isSVG){
    const fb=document.createElement('div'); fb.className='sh-fill'; fb.style.background=color;
    const fa=()=>{ wrap.querySelectorAll('.sp').forEach(p=>p.setAttribute('fill',color)); fb.style.background=color; };
    fb.addEventListener('click',e=>{ e.stopPropagation(); fa(); });
    fb.addEventListener('touchend',e=>{ e.preventDefault(); e.stopPropagation(); fa(); },{passive:false});
    wrap.appendChild(fb);
  }
  // ↘ resize
  const rh=document.createElement('div'); rh.className='sh-resize'; rh.textContent='↘';
  makeResizable(wrap,rh,!isSVG);
  wrap.appendChild(del);
  wrap.appendChild(rh);
}

// ═══ DRAG ═══
function makeDraggable(el,container){
  let sx,sy,ox,oy;
  const skip=e=>e.target.classList.contains('sh-resize')||e.target.classList.contains('sh-del')||e.target.classList.contains('sh-fill')||e.target.closest('svg');
  const s=(cx,cy)=>{ sx=cx; sy=cy; ox=parseInt(el.style.left)||0; oy=parseInt(el.style.top)||0; };
  const m=(cx,cy)=>{
    el.style.left=Math.max(0,Math.min(container.clientWidth-el.offsetWidth,ox+cx-sx))+'px';
    el.style.top=Math.max(0,Math.min(container.clientHeight-el.offsetHeight,oy+cy-sy))+'px';
  };
  el.addEventListener('mousedown',e=>{ if(skip(e)) return; e.preventDefault(); s(e.clientX,e.clientY); const mm=e2=>m(e2.clientX,e2.clientY); const mu=()=>{ document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); }; document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu); });
  el.addEventListener('touchstart',e=>{ if(skip(e)) return; s(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
  el.addEventListener('touchmove',e=>{ if(skip(e)) return; e.stopPropagation(); e.preventDefault(); m(e.touches[0].clientX,e.touches[0].clientY); },{passive:false});
}

// ═══ RESIZE ═══
function makeResizable(el,handle,free=false){
  let sx,sy,ow,oh;
  const s=(cx,cy)=>{ sx=cx; sy=cy; ow=el.offsetWidth; oh=el.offsetHeight; };
  const m=(cx,cy)=>{
    if(free){
      el.style.width=Math.max(40,ow+(cx-sx))+'px';
      el.style.height=Math.max(40,oh+(cy-sy))+'px';
    } else {
      const w=Math.max(40,Math.min(Math.min(SW,SH)-10,ow+(cx-sx)));
      el.style.width=el.style.height=w+'px';
    }
  };
  handle.addEventListener('mousedown',e=>{ e.stopPropagation(); e.preventDefault(); s(e.clientX,e.clientY); const mm=e2=>m(e2.clientX,e2.clientY); const mu=()=>{ document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); }; document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu); });
  handle.addEventListener('touchstart',e=>{ e.stopPropagation(); s(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
  handle.addEventListener('touchmove',e=>{ e.stopPropagation(); e.preventDefault(); m(e.touches[0].clientX,e.touches[0].clientY); },{passive:false});
}

// ═══ PINTURA LIBRE ═══
function initPaint(){
  const cv=document.getElementById('paint-canvas');
  const ctx=cv.getContext('2d');
  const xy=e=>{ const r=cv.getBoundingClientRect(); const s=e.touches?e.touches[0]:e; return{x:(s.clientX-r.left)*(cv.width/r.width),y:(s.clientY-r.top)*(cv.height/r.height)}; };
  const dot=p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,(eraser?brushSz*2.2:brushSz)/2,0,Math.PI*2); ctx.fillStyle=eraser?'#fff':color; ctx.fill(); lx=p.x; ly=p.y; };
  const line=p=>{ ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.strokeStyle=eraser?'#fff':color; ctx.lineWidth=eraser?brushSz*2.5:brushSz; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke(); lx=p.x; ly=p.y; };
  cv.addEventListener('mousedown',e=>{ if(selIcon){ const p=xy(e); placeSticker(p.x,p.y); return; } e.preventDefault(); painting=true; dot(xy(e)); });
  cv.addEventListener('mousemove',e=>{ if(!painting||selIcon) return; e.preventDefault(); line(xy(e)); });
  cv.addEventListener('mouseup',()=>painting=false);
  cv.addEventListener('mouseleave',()=>painting=false);
  cv.addEventListener('touchstart',e=>{ if(selIcon){ const p=xy(e); placeSticker(p.x,p.y); return; } e.preventDefault(); painting=true; dot(xy(e)); },{passive:false});
  cv.addEventListener('touchmove',e=>{ if(!painting||selIcon) return; e.preventDefault(); line(xy(e)); },{passive:false});
  cv.addEventListener('touchend',()=>painting=false);
}

const FCOLS=['#FF3B30','#FF9500','#FFCC00','#34C759','#007AFF','#6C3FC8','#FF2D55','#8B4513','#FF6B00','#5AC8FA','#FFD700','#1C1C1E'];
function buildMarcoModal(){

function updPrev(){
  const pv=document.getElementById('fm-prev'); pv.style.background=fColor;
  const inn=document.getElementById('fm-prev-in');
  const W=pv.clientWidth||200, H=pv.clientHeight||54;
  const ratio=fWidth/Math.min(SW||300,SH||300);
  const fw=Math.max(4,Math.round(ratio*Math.min(W,H)));

}

function applyFrame(){
  const fc=document.getElementById('frame-canvas');
  fc.width=SW; fc.height=SH; // asegurar dimensiones
  const ctx=fc.getContext('2d');
  const W=SW, H=SH, fw=fWidth;
  ctx.clearRect(0,0,W,H);
  // Dibujar marco sólido con hueco interior transparente
  ctx.save();
  ctx.fillStyle=fColor;
  rrect(ctx,0,0,W,H,12); ctx.fill();
  ctx.globalCompositeOperation='destination-out';
  rrect(ctx,fw,fw,W-fw*2,H-fw*2,6); ctx.fill();
  ctx.restore();
  // Líneas decorativas
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=2.5; ctx.lineCap='round';
  rrect(ctx,fw-5,fw-5,W-(fw-5)*2,H-(fw-5)*2,9); ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.1)'; ctx.lineWidth=1.8;
  rrect(ctx,fw+4,fw+4,W-(fw+4)*2,H-(fw+4)*2,5); ctx.stroke();
  ctx.restore();
  // Ornamentos de esquina
  [[fw,fw,1,1],[W-fw,fw,-1,1],[fw,H-fw,1,-1],[W-fw,H-fw,-1,-1]].forEach(([cx,cy,sx,sy])=>{
    ctx.save(); ctx.translate(cx,cy); ctx.scale(sx,sy);
    ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=2.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(0,-4); ctx.moveTo(-14,0); ctx.lineTo(-4,0); ctx.stroke();
    ctx.restore();
  });
  toast('¡Marco aplicado! Puedes seguir dibujando 🖼️');
}

function rrect(ctx,x,y,w,h,r){
  if(w<r*2) r=w/2; if(h<r*2) r=h/2; if(w<=0||h<=0) return;
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

  const sz=Math.max(ltFontSz+20,80);
  const wrap=document.createElement('div');
  wrap.className='sticker';
  wrap.style.cssText=`left:${SW/2-sz/2}px;top:${SH/2-sz/2}px;width:${sz}px;height:auto;min-width:${sz}px;position:absolute;pointer-events:all;touch-action:none;user-select:none;display:flex;align-items:center;justify-content:center;padding:4px;`;
  const span=document.createElement('span');
  span.style.cssText=`font-family:'Arial Rounded MT Bold',Arial,sans-serif;font-size:${ltFontSz}px;font-weight:900;color:${color};line-height:1.1;pointer-events:none;white-space:nowrap;`;
  if(ltDir==='v') span.style.writingMode='vertical-rl';
  if(ltDir==='d') wrap.style.transform='rotate(-30deg)';
  span.textContent=ltText;
  wrap.appendChild(span);
  // handles para letra
  const del=document.createElement('div'); del.className='sh-del'; del.textContent='✕';
  del.addEventListener('click',e=>{ e.stopPropagation(); layer.removeChild(wrap); });
  del.addEventListener('touchend',e=>{ e.preventDefault(); e.stopPropagation(); layer.removeChild(wrap); },{passive:false});
  const rh=document.createElement('div'); rh.className='sh-resize'; rh.textContent='↘';
  let sx2,ow2;
  rh.addEventListener('mousedown',e=>{ e.stopPropagation(); e.preventDefault(); sx2=e.clientX; ow2=parseInt(span.style.fontSize); const mm=e2=>{ const ns=Math.max(12,Math.min(200,ow2+(e2.clientX-sx2))); span.style.fontSize=ns+'px'; }; const mu=()=>{ document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); }; document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu); });
  rh.addEventListener('touchstart',e=>{ e.stopPropagation(); sx2=e.touches[0].clientX; ow2=parseInt(span.style.fontSize); },{passive:true});
  rh.addEventListener('touchmove',e=>{ e.stopPropagation(); e.preventDefault(); const ns=Math.max(12,Math.min(200,ow2+(e.touches[0].clientX-sx2))); span.style.fontSize=ns+'px'; },{passive:false});
  wrap.appendChild(del); wrap.appendChild(rh);
  layer.appendChild(wrap);
  makeDraggable(wrap,layer);
  closeLt();
}
function closeLt(){ document.getElementById('lt-bg').classList.remove('open'); ltText=''; document.getElementById('lt-prev').textContent='_'; }
document.getElementById('btn-letra').addEventListener('click',()=>{ buildLetrasModal(); document.getElementById('lt-bg').classList.add('open'); });
document.getElementById('lt-cancel').addEventListener('click',closeLt);
document.getElementById('lt-ok').addEventListener('click',()=>placeLetter(false));
document.getElementById('lt-fill').addEventListener('click',()=>placeLetter(true));
['lt-h','lt-v','lt-d'].forEach(id=>{ document.getElementById(id).addEventListener('click',()=>{ ltDir=id.replace('lt-',''); ['lt-h','lt-v','lt-d'].forEach(i=>document.getElementById(i).classList.remove('on')); document.getElementById(id).classList.add('on'); }); });
document.getElementById('lt-size').addEventListener('input',e=>ltFontSz=+e.target.value);

// ═══ MODAL GUARDAR ═══
document.querySelectorAll('.size-row').forEach(row=>{
  row.addEventListener('click',()=>{ document.querySelectorAll('.size-row').forEach(r=>r.classList.remove('sel')); row.classList.add('sel'); });
});
document.getElementById('btn-guardar').addEventListener('click',()=>document.getElementById('save-modal').classList.add('open'));
document.getElementById('save-cancel').addEventListener('click',()=>document.getElementById('save-modal').classList.remove('open'));
document.getElementById('save-ok').addEventListener('click',async()=>{
  document.getElementById('save-modal').classList.remove('open');
  const sel=document.querySelector('input[name="psize"]:checked').value;
  const SIZES={screen:[SW*2,SH*2],a4l:[3508,2480],a4p:[2480,3508],letter:[3300,2550],'4x6':[1800,1200]};
  const [PW,PH]=SIZES[sel];
  const scX=PW/SW, scY=PH/SH;
  const off=document.createElement('canvas'); off.width=PW; off.height=PH;
  const ctx=off.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,PW,PH);
  // Marco primero (detrás)
  const fc=document.getElementById('frame-canvas');
  ctx.save(); ctx.scale(scX,scY); ctx.drawImage(fc,0,0); ctx.restore();
  // Pintura
  ctx.save(); ctx.scale(scX,scY); ctx.drawImage(document.getElementById('paint-canvas'),0,0); ctx.restore();
  // Stickers e imágenes
  const sl=document.getElementById('sticker-layer');
  for(const st of sl.querySelectorAll('.sticker')){
    const x=(parseInt(st.style.left)||0)*scX;
    const y=(parseInt(st.style.top)||0)*scY;
    const w=st.offsetWidth*scX;
    const h=st.offsetHeight*scY;
    const imgEl=st.querySelector('img');
    if(imgEl){ ctx.drawImage(imgEl,x,y,w,h); continue; }
    const svgEl=st.querySelector('svg');
    if(svgEl){
      const vb=svgEl.getAttribute('viewBox')||'0 0 32 32';
      const str=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${st.offsetWidth}" height="${st.offsetHeight}">${svgEl.innerHTML}</svg>`;
      await new Promise(res=>{ const img=new Image(); const blob=new Blob([str],{type:'image/svg+xml'}); img.onload=()=>{ ctx.drawImage(img,x,y,w,h); URL.revokeObjectURL(img.src); res(); }; img.onerror=res; img.src=URL.createObjectURL(blob); });
    }
    const span=st.querySelector('span');
    if(span&&!svgEl){ ctx.font=`900 ${parseInt(span.style.fontSize)*scX}px Arial`; ctx.fillStyle=span.style.color||'#111'; ctx.fillText(span.textContent,x,y+parseInt(span.style.fontSize)*scY); }
  }
  const labels={screen:'pantalla',a4l:'A4-horizontal',a4p:'A4-vertical',letter:'carta','4x6':'foto-4x6'};
  const a=document.createElement('a'); a.download=`obra-${labels[sel]}-${Date.now()}.png`; a.href=off.toDataURL('image/png',1.0); a.click();
  toast(`¡Guardado en ${labels[sel]}! 🎉`);
});

// ═══ TOAST ═══
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }

// ═══ INIT ═══
window.addEventListener('DOMContentLoaded',()=>{ layout(); buildSidebar(); buildPalette(); buildMarcoModal(); initPaint(); drawPrev(); });
window.addEventListener('resize',layout);
</script>
